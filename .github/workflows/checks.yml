name: Checks

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  checkPrettier:
    name: Check Prettier
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - uses: actions/setup-node@v7
        with:
          node-version: '22.23.4'
      - name: Check code formatting
        run: npx prettier --check .
